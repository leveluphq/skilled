table:
  name: code_submissions
  schema: public
object_relationships:
- name: lesson
  using:
    foreign_key_constraint_on: lessonId
- name: user
  using:
    foreign_key_constraint_on: userId
select_permissions:
- permission:
    columns:
    - code
    - codeRunnerStatusDescription
    - codeRunnerStatusId
    - codeRunnerToken
    - compileOutput
    - compileOutputDecoded
    - createdAt
    - diagnostics
    - environment
    - executionStatus
    - id
    - language
    - lessonId
    - logs
    - memory
    - message
    - messageDecoded
    - resultStatus
    - results
    - runnerVersion
    - stderr
    - stderrDecoded
    - stdout
    - stdoutDecoded
    - tests
    - time
    - updatedAt
    - userId
    - validator
    filter:
      userId:
        _is_null: true
    limit: 1
  role: anonymous
- permission:
    columns:
    - code
    - codeRunnerStatusDescription
    - codeRunnerStatusId
    - codeRunnerToken
    - compileOutput
    - compileOutputDecoded
    - createdAt
    - diagnostics
    - environment
    - executionStatus
    - id
    - language
    - lessonId
    - logs
    - memory
    - message
    - messageDecoded
    - resultStatus
    - results
    - runnerVersion
    - stderr
    - stderrDecoded
    - stdout
    - stdoutDecoded
    - tests
    - time
    - updatedAt
    - userId
    - validator
    filter:
      userId:
        _eq: X-Hasura-User-Id
  role: user

name: Public SEO audit

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed public origin, for example https://skilled.dev'
        required: true
        type: string
  schedule:
    - cron: '41 15 * * 1'

permissions:
  contents: read

jobs:
  audit:
    # Forks opt in with a repository variable; there is no inherited host target.
    if: github.event_name == 'workflow_dispatch' || vars.PUBLIC_SITE_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SEO_BASE_URL: ${{ inputs.base_url || vars.PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the complete source inventory anonymously
        run: python3 scripts/check-public-seo.py --base-url "$SEO_BASE_URL" --workers 4 --report public-seo.json
      - name: Save the audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-seo-audit
          path: public-seo.json
          if-no-files-found: ignore
          retention-days: 30
